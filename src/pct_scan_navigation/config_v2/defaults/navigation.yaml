version: 2

topics:
  body_pose: /Odometry_open3d
  sensor_pose: /Odometry_open3d
  cloud: /scan_map
  goal: /goal_pose
  waypoints: /scan_planner/waypoints
  initial_path: /initial_path

localization:
  voxel_size_coarse: 0.2
  voxel_downsample_size: 0.1
  icp_distance_threshold: 0.2
  fitness_eval_threshold: 0.2
  tracking_fitness: 0.7
  initial_fitness: 0.9
  max_tracking_translation: 2.0
  max_tracking_yaw_deg: 2.0
  max_initial_translation: 10.0
  max_initial_yaw_deg: 180.0

local_planner:
  grid_resolution: 0.2
  planning_horizon: 5.5
  emergency_time: 1.0
  sliding_map_size: [10.0, 10.0, 5.0]
  local_update_range: [5.5, 5.5, 3.0]
  map_sliding_enabled: true
  map_sliding_threshold: 0.2

controller:
  time_forward: 0.6
  heading_error_threshold: 0.8
  kp_position: 0.8
  kp_yaw: 1.5
  finish_distance: 0.15
  finish_yaw: 0.1


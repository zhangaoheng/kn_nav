version: 2

deployment:
  name: a2_outdoor
  robot_profile: a2
  map_profile: a2
  map_root: /home/nav_map
  active_map: outdoor
  enabled_maps:
    - outdoor
    - cross-floor-kn

external:
  livox_config: /home/code/work_space/ws_livox/src/livox_ros_driver2/config/MID360_config.json

calibration:
  imu_to_base_file: /home/nav_map/outdoor/imu_to_base.txt

startup:
  use_sim_time: false
  navigation_mode: 2
  start_localization: true
  start_global_planner: true
  start_velocity_bridge: false

tuning:
  localization:
    icp_distance_threshold: 0.2
    fitness_eval_threshold: 0.2
    tracking_fitness: 0.8
    initial_fitness: 0.9
    max_tracking_translation: 0.4
    max_tracking_yaw_deg: 2.0
    max_initial_translation: 20.0
    max_initial_yaw_deg: 180.0
  local_planner:
    planning_horizon: 3.5
    sliding_map_size: [10.0, 10.0, 5.0]
    local_update_range: [5.5, 5.5, 3.0]
    map_sliding_enabled: true
    map_sliding_threshold: 0.2
  robot_geometry:
    double_cylinder_radius: 0.28
    double_cylinder_offset: 0.23
    obstacles_inflation_z_up: 0.1
    obstacles_inflation_z_down: 0.1
  unitree:
    sport_state_topic: rt/sportmodestate
  motion:
    max_vx: 0.2
    max_abs_vy: 0.1
    max_abs_vyaw: 0.3
    max_linear_acceleration: 0.2
    max_yaw_acceleration: 0.3

safety:
  allow_automatic_enable: false

global_relocalization_node:
  ros__parameters:
    # Safety default: reject triggers until explicitly enabled.
    enabled: false
    map_topic: /map_3d
    scan_topic: /scan_base_link
    status_topic: /localization_status
    initialpose_topic: /initialpose

    # Empty uses the legacy map-tile fallback. Set this to the parent directory
    # containing one verified database directory per map name.
    keyframe_database_root: ''
    keyframe_fpfh_radius: 2.0
    keyframe_ransac_distance: 1.0
    keyframe_gicp_distance: 0.6
    keyframe_ransac_iterations: 40000
    max_keyframe_tilt_delta_deg: 20.0

    # ScanContext-inspired polar descriptor, independently implemented.
    descriptor_rings: 20
    descriptor_sectors: 60
    descriptor_radius: 20.0
    tile_size: 24.0
    tile_height: 3.0
    min_tile_points: 500
    max_candidates: 5
    min_descriptor_score: 0.15

    # Keyframe mode uses FPFH/RANSAC coarse registration and GICP refinement.
    # Legacy mode uses coarse yaw/centroid alignment and multi-resolution ICP.
    voxel_size: 0.4
    min_scan_points: 300
    min_target_points: 800
    min_fitness: 0.70
    max_inlier_rmse: 0.40
    max_abs_z: 5.0
    max_scan_age_s: 2.0
    target_half_xy: 12.0
    target_half_z: 2.0
    ground_plane_distance: 0.15
    min_fitness_margin: 0.05
    ambiguity_translation_m: 1.0
    ambiguity_yaw_deg: 10.0

/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/os_cloud_node/points"
            imu_topic:  "/os_cloud_node/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            
        preprocess:
            lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
            scan_line: 64
            timestamp_unit: 3                 # 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 4.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     150.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.]

        robustness:
            enable: true
            imu_accel_saturation_threshold: 3.9
            imu_saturation_noise_scale: 100.0
            imu_saturation_ratio_warn: 0.05
            imu_saturation_streak_warn: 3
            min_effective_ratio: 0.30
            min_effective_points: 80
            max_mean_residual: 0.05
            critical_effective_ratio: 0.15
            critical_mean_residual: 0.08
            max_update_translation: 0.15
            max_update_rotation_deg: 2.0
            max_update_velocity: 1.0
            degraded_enter_frames: 3
            recover_enter_frames: 10
            recover_normal_frames: 10
            max_degraded_duration: 1.5
            zero_effective_lost_frames: 5
            max_imu_dt: 0.02
            imu_gap_noise_scale: 100.0
            max_propagation_translation: 0.20
            max_propagation_velocity: 2.0

        publish:
            path_en:  false
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

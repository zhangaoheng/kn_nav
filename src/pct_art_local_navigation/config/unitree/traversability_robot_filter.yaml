traversability_estimation:
  ros__parameters:
    # Traversability map filter parameters
    # 输入是 FastDEM/elevation map，输出 0.0~1.0 的 traversability 图层：
    # 1.0 表示最容易通过，0.0 表示不可通行或风险最高。
    traversability_map_filters:
      filter1:
        # 根据 elevation 层估计地表法向量，后面的坡度滤波会使用 surface_normal_z。
        name: normal_vectors_filter
        type: gridMapFilters/NormalVectorsFilter
        params:
          # 输入高度层名称，必须和上游 GridMap 中的 elevation 层一致。
          input_layer: elevation
          # 输出法向量层名前缀，会生成 surface_normal_x/y/z。
          output_layers_prefix: surface_normal_
          # 法向量估计半径 [m]。越大越平滑但越慢，楼梯边缘也更容易被抹成大坡面。
          radius: 0.25
          # 约束法向量朝 z 轴正方向，避免法向量翻转导致坡度计算异常。
          normal_vector_positive_axis: z
      filter2:
        # 坡度评分：根据 surface_normal_z 计算坡度，坡度越大 traversability_slope 越低。
        name: slope_filter
        type: traversabilityFilters/SlopeFilter
        params:
          # 输出坡度评分层，后面 fusion 会读取这个层。
          map_type: traversability_slope
          # 最大允许坡度 [rad]。0.7rad 约等于 40 度；超过后该层评分为 0。
          critical_value: 1.0
      filter3:
        # 台阶/高度突变评分：统计局部窗口内的高度差，台阶越大 traversability_step 越低。
        name: step_filter
        type: traversabilityFilters/StepFilter
        params:
          # 输出台阶评分层，后面 fusion 会读取这个层。
          map_type: traversability_step
          # 最大允许局部高度差 [m]。超过该值的格子会被认为是台阶风险点。
          critical_value: 0.30
          # 第一层窗口半径 [m]，用于每个格子附近的最大-最小高度差估计。
          first_window_radius: 0.16
          # 第二层窗口半径 [m]，用于统计周围有多少格子的 step_height 超限。
          second_window_radius: 0.25
          # 触发不可通行需要的超限格子数量。越大越不容易被单个噪点打黑。
          critical_cell_number: 4
      # filter4:
      #   type: traversabilityFilters/RoughnessFilter
      #   params:
      #     map_type: traversability_roughness
      #     critical_value: 0.05
      #     estimation_radius: 0.05
      filter4:
        # 融合最终 traversability。当前只融合坡度和台阶，roughness 未启用。
        name: traversability_fusion
        type: gridMapFilters/MathExpressionFilter
        params:
          # ART 和 coordinator 主要消费的最终通行性层。
          output_layer: traversability
          # 最终评分公式。权重越高的子层，对路径是否可走影响越大。
          expression: 0.5 * (traversability_slope + traversability_step)
      # filter6:
      #   type: gridMapFilters/DeletionFilter
      #   params:
      #     layers: [surface_normal_x, surface_normal_y, surface_normal_z]

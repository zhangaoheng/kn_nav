pure_pursuit_node:
  ros__parameters:
    k: 0.5
    Lfc: 0.5
    Kp: 1.0
    dt: 0.1
    # 目标距离阈值参数；当前主要到达判定在 coordinator 中完成，建议与 goal_reached_distance 保持接近。
    goal_threshold: 0.15
    # final_approach 为 true 且距离路径终点进入该范围后，控制器停止线速度并只调整最终朝向。
    # 该值若大于 coordinator.goal_reached_distance，可能出现已经停住但还未被判定到达。
    final_heading_entry_distance: 0.10
    # 最终朝向调整的角速度死区，yaw 误差小于该值时输出 0 角速度。
    final_heading_command_deadband: 0.10
    # 最终朝向调整时的最小角速度，用于克服低速转不动的问题。
    min_final_angular_velocity: 0.20
    max_acceleration: 0.08
    minCurvature: 0.0
    maxCurvature: 3.0
    minVelocity: 0.40
    maxVelocity: 0.40
    maxAngularVelocity: 1.0
    # 路径跟踪目标方向与当前朝向偏差超过该值时，先原地转向再前进。
    rotate_to_path_threshold: 1.047
    # 原地转向到路径方向时的退出容差。
    rotate_to_path_tolerance: 0.349
    # 最终目标航向容差参数；实际最终停止主要受 final_heading_command_deadband 和 coordinator 判定影响。
    goal_yaw_tolerance: 0.175
    # 转向路径方向或最终目标方向时的角速度比例增益。
    rotate_to_heading_gain: 2.0
    # coordinator 在最终段发布该话题；直接跟全局路径测试时若没有该信号，通常不会进入最终朝向调整逻辑。
    final_approach_topic: /pct_art_local_navigation/final_approach
    obstacle_th: 0.5
    odom_topic: /Odometry_open3d
    odom_timeout: 1.0

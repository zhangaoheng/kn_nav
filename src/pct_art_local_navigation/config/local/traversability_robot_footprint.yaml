traversability_estimation:
  ros__parameters:
    # Footprint parameters
    # 这些参数用于 footprint/path 安全检查和 footprint 可视化，不直接改变基础 traversability 层。
    footprint:
      # 多边形足迹顶点 [x1, y1, x2, y2, ...]，单位 [m]，坐标在 footprint_frame_id 下。
      footprint_polygon: [0.0, 0.0, 0.5, 0.0, 0.5, 0.5, 0.0, 0.50]
      # 圆形 footprint 外接半径 [m]，路径检查会按该半径覆盖周围格子。
      circular_footprint_radius: 0.541
      # 圆形 footprint 内切/核心半径 [m]，用于区分必须安全的中心区域。
      circular_footprint_radius_inscribed: 0.30
      # footprint 检查额外膨胀距离 [m]，越大越保守。
      circular_footprint_offset: 0.15
      # footprint 坐标系，通常是 base_link。
      footprint_frame_id: base_link
      # 未知区域默认通行性评分。低于 ART 阈值时未知区域更容易被视为不可走。
      traversability_default: 0.3
      # 是否在 footprint 检查中额外检查 roughness 层；当前 RoughnessFilter 未启用，所以保持 false。
      verify_roughness_footprint: false
      # 是否检查机器人在 footprint 上的倾斜程度；当前没有 robot_slope 输入时保持 false。
      check_robot_inclination: false
